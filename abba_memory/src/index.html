<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>오캉과 엄마: 아빠의 기억 (데모)</title>
<style>
  html, body { margin: 0; height: 100%; background: #141C33; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #game { display: block; touch-action: none; user-select: none; -webkit-user-select: none;
          -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #debug { position: fixed; top: 8px; right: 8px; width: 230px; max-height: 92vh; overflow: auto;
           background: rgba(20, 28, 51, 0.95); color: #F4E6CC; border: 2px solid #D9A441;
           border-radius: 8px; padding: 8px; font-size: 13px; z-index: 10; }
  #debug button, #debug select { display: block; width: 100%; margin: 4px 0; padding: 5px;
           font-size: 13px; }
  #debug .row { display: flex; gap: 4px; }
  #debug .row select, #debug .row button { width: auto; flex: 1; }
  #debug pre { white-space: pre-wrap; font-size: 11px; margin: 4px 0 0; }
  #debugOpen { position: fixed; top: 4px; left: 4px; z-index: 11; opacity: 0.5; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- 스크립트 목록: 순서대로 불러옵니다 (ES module·fetch 쓰지 않음).
     열 때마다 주소 끝에 시각을 붙여, 브라우저가 예전 파일을 기억해 두었다가 쓰지 않게 합니다 (편집기로 저장한 값이 바로 보이게).
     제출본 빌드(tools/build_single.py)는 이 SCRIPTS 목록을 읽어 한 파일에 넣습니다. -->
<script>
var SCRIPTS = ['data.js', 'ui_text.js', 'rng.js', 'board.js', 'order.js', 'expand.js', 'story_data.js',
  'story.js', 'tutorial.js', 'scene.js', 'ui.js', 'debug.js', 'edit.js', 'main.js'];
var BUST = '?t=' + Date.now();
SCRIPTS.forEach(function (f) { document.write('<script src="' + f + BUST + '"><\/script>'); });
</script>
</body>
</html>
